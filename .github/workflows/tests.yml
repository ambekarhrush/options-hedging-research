name: research-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ".[notebooks]"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_results.py
      - run: python -m hedgelab.study
      - run: python scripts/check_notebooks.py
      - run: python -m hedgelab.robustness
